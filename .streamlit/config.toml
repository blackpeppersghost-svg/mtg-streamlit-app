[theme]
# メイン背景色（重厚なピュアブラックに近いダークグレー）
backgroundColor = "#121212"

# サブ背景色（入力枠やプレビュー枠。少しだけ浮き上がらせる色）
secondaryBackgroundColor = "#1E1E24"

# テキストカラー（真っ白ではなく、目に優しいオフホワイト）
textColor = "#E0E0E0"

# アクセントカラー（ゲーミング感のある鮮やかな色。以下はネオンパープルの例）
# ※MTGの赤マナっぽくするなら #FF4444 や、サイバーパンク風のシアン #00E5FF もおすすめ！
primaryColor = "#7B61FF"

# ゲーミングUIに合うすっきりしたフォント
font = "sans serif"
